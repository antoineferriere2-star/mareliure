<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Technical crosshair guides -->
  <line x1="60" y1="12" x2="60" y2="100" stroke="#0F1B2D" stroke-width="1" stroke-dasharray="3 4" opacity="0.55"/>
  <line x1="24" y1="58" x2="108" y2="58" stroke="#0F1B2D" stroke-width="1" stroke-dasharray="3 4" opacity="0.55"/>
  <line x1="30" y1="84" x2="20" y2="98" stroke="#0F1B2D" stroke-width="1" stroke-dasharray="3 4" opacity="0.55"/>

  <!-- Square frame: navy (left, bottom, top-left) -->
  <path d="M30 30 H58" stroke="#0F1B2D" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M30 30 V90" stroke="#0F1B2D" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M30 90 H90" stroke="#0F1B2D" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M90 90 V58" stroke="#0F1B2D" stroke-width="2.5" stroke-linecap="square"/>

  <!-- Square frame: sage accent (top-right) -->
  <path d="M58 30 H90" stroke="#7E9B82" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M90 30 V58" stroke="#7E9B82" stroke-width="2.5" stroke-linecap="square"/>

  <!-- Bold M monogram -->
  <path d="M42 80 V44 L60 66 L78 44 V80" stroke="#0F1B2D" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Target / crosshair point bottom-left -->
  <circle cx="20" cy="98" r="5" stroke="#0F1B2D" stroke-width="1.5"/>
  <line x1="11" y1="98" x2="29" y2="98" stroke="#0F1B2D" stroke-width="1"/>
  <line x1="20" y1="89" x2="20" y2="107" stroke="#0F1B2D" stroke-width="1"/>
</svg>
